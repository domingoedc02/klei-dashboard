name: perf
on:
  pull_request:
    branches: [main]
    paths: ["backend/**", "infra/ci/perf.sh"]
jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "25", cache: maven}
      # shortcut: a shared runner is slower than the operator's host, so a miss here is a prompt to look, not proof; tune budgets only with PRD NFR-2 owner.
      - run: infra/ci/perf.sh
      - if: always()
        uses: actions/upload-artifact@v4
        with: {name: perf-report, path: backend/app/target/perf-report.txt, if-no-files-found: ignore}
