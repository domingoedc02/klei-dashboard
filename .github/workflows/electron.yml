name: electron

# Build, type-check, test and smoke-launch the Electron preview on the three OS families. Story 19.2.
on:
  push:
    paths:
      - "electron/**"
      - ".github/workflows/electron*.yml"
  pull_request:
    paths:
      - "electron/**"
      - ".github/workflows/electron*.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            headless: ""
          - os: windows-latest
            headless: ""
          - os: ubuntu-latest
            headless: xvfb-run -a
    defaults:
      run:
        working-directory: electron
        shell: bash
    env:
      KLEI_API_URL: http://127.0.0.1:8080
      KLEI_AUTH_URL: http://127.0.0.1:8081
      # Placeholder only: a 44-character path token on a host that cannot resolve. The real URL is a secret of the release workflow.
      KLEI_DOWNLOAD_BASE_URL: https://download.invalid/ci-placeholder-not-a-secret-0123456789abcdef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: electron/package-lock.json
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb libasound2t64 libgbm1 libgtk-3-0t64 libnss3
      - run: npm ci
      - name: Linux sandbox helper
        if: runner.os == 'Linux'
        # Ubuntu 24.04 restricts unprivileged user namespaces; the setuid helper keeps Chromium's sandbox on.
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - run: npm run typecheck
      - name: Tests
        run: ${{ matrix.headless }} npm test 2>&1 | tee test.log
      - name: No unlisted skips
        run: node scripts/check-skips.mjs test.log
      - name: Build
        run: |
          npm run build
          npm run build:renderer
      - name: Smoke launch (KLEI_SMOKE=1, exits 0 or fails)
        run: ${{ matrix.headless }} node scripts/smoke.mjs "$(node -p "require('electron')")" .
      - name: No tokens in the build output
        run: node scripts/scan-secrets.mjs build
