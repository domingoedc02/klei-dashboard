name: electron-protect

# No path filters on purpose: a filter could hide an edit to the protected Tauri app. Story 19.1.
on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  protect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node electron/scripts/protected-paths.mjs
