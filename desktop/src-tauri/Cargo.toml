[package]
name = "klei-desktop"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false

[lib]
name = "klei_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-single-instance = { version = "2.5.5", features = ["deep-link"] }
keyring = "4.2.0"
reqwest = { version = "0.13.5", features = ["json", "multipart"] }
tokio = { version = "1.54.1", features = ["net", "time", "sync", "io-util", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
base64 = "0.23.1"
getrandom = "0.4.3"
url = "2.5.8"
open = "5.4.5"
tauri-plugin-dialog = "2.7.3"
tauri-plugin-updater = "2.14.1"
zip = { version = "9.5.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tauri = { version = "2.12.5", features = ["test"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
